# Aerotermia Vaillant (ebusd) - programas horarios del termostato desde Home Assistant
# Package generado con build/build_package.cjs. Ver README.md (requisitos, instalacion, avisos).
# Los scripts *_aplicar_* ESCRIBEN en el bus eBUS.
# Topics: todos usan el prefijo ebusd/basv0/ (circuito basv0 del termostato); si el tuyo se llama distinto,
# sustituye 'ebusd/basv0/' en este fichero.
input_select:
  acs_horario_dia:
    name: ACS horario día
    icon: mdi:calendar-week
    options:
      - Lunes
      - Martes
      - Miércoles
      - Jueves
      - Viernes
      - Sábado
      - Domingo
  acs_horario_programa:
    name: ACS horario programa
    icon: mdi:timetable
    options:
      - ACS
      - Refrigeración
      - Reducción de ruido
  calefaccion_horario_dia:
    name: Calefaccion horario dia
    icon: mdi:calendar-week
    options:
      - Lunes
      - Martes
      - Miércoles
      - Jueves
      - Viernes
      - Sábado
      - Domingo
input_datetime:
  acs_horario_desde:
    name: ACS horario franja 1 desde
    icon: mdi:clock-start
    has_date: false
    has_time: true
  acs_horario_hasta:
    name: ACS horario franja 1 hasta
    icon: mdi:clock-end
    has_date: false
    has_time: true
  acs_horario_franja_2_desde:
    name: ACS horario franja 2 desde
    icon: mdi:clock-start
    has_date: false
    has_time: true
  acs_horario_franja_2_hasta:
    name: ACS horario franja 2 hasta
    icon: mdi:clock-end
    has_date: false
    has_time: true
  acs_horario_franja_3_desde:
    name: ACS horario franja 3 desde
    icon: mdi:clock-start
    has_date: false
    has_time: true
  acs_horario_franja_3_hasta:
    name: ACS horario franja 3 hasta
    icon: mdi:clock-end
    has_date: false
    has_time: true
input_text:
  calefaccion_horario_texto:
    name: Calefaccion horario texto
    icon: mdi:text-box-edit
    min: 0
    max: 255
    mode: text
    initial: ""
mqtt:
  sensor:
    - name: ACS horario Lunes 1
      unique_id: acs_horario_lunes_1
      state_topic: ebusd/basv0/HwcTimer_Monday0
      value_template: "{% if value_json.from.value == value_json.to.value %}sin franja{% else %}{{ value_json.from.value }}-{{ value_json.to.value }}{% endif %}"
      icon: mdi:water-boiler-auto
      device:
        identifiers:
          - aerotermia_horarios
        name: Horarios aerotermia
        manufacturer: ebusd
        model: Programas horarios del termostato (b555)
      entity_category: diagnostic
