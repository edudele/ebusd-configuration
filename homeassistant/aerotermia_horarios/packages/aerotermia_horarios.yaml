script:
  acs_aplicar_horario:
    alias: ACS/Refrigeración/Ruido - Aplicar horario del día al termostato
    icon: mdi:water-boiler-auto
    description: "Escribe en el termostato (b555, circuito basv0) las franjas del día y programa elegidos (ACS, Refrigeración Z1 o Reducción de ruido), en orden, usando los helpers 'ACS horario ...'. El número de franjas se deduce: cuenta hasta la última franja rellena (desde = hasta, p. ej. 00:00-00:00, es vacía). Sin huecos ni solapes. El termostato rechaza (código 04) una franja suelta, por eso se manda el día completo desde la franja 1. 'hasta' 23:59 y 00:00 se envían como 24:00. Escribe de verdad en el bus eBUS. Solo en Reducción de ruido se permite dejar el día vacío (0 franjas): se envía 0;0;00:00;00:00."
    mode: single
    sequence:
      - variables:
          dias_en:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          programa: "{{ states('input_select.acs_horario_programa') }}"
          set_pref: "{{ {'ACS': 'HwcTimerSet_', 'Refrigeración': 'Z1TimerCoolSet_', 'Reducción de ruido': 'SilentTimerSet_'}[programa] }}"
          get_pref: "{{ {'ACS': 'HwcTimer_', 'Refrigeración': 'Z1TimerCool_', 'Reducción de ruido': 'SilentTimer_'}[programa] }}"
          slots_topic: "{{ {'ACS': 'HwcTimerSlots', 'Refrigeración': 'Z1TimerCoolSlots', 'Reducción de ruido': 'SilentTimerSlots'}[programa] }}"
          dia_idx: "{{ state_attr('input_select.acs_horario_dia', 'options').index(states('input_select.acs_horario_dia')) }}"
          dia_en: "{{ dias_en[dia_idx | int] }}"
          desde: "{{ [states('input_datetime.acs_horario_desde')[:5], states('input_datetime.acs_horario_franja_2_desde')[:5], states('input_datetime.acs_horario_franja_3_desde')[:5]] }}"
          hasta_raw: "{{ [states('input_datetime.acs_horario_hasta')[:5], states('input_datetime.acs_horario_franja_2_hasta')[:5], states('input_datetime.acs_horario_franja_3_hasta')[:5]] }}"
          hasta: "{{ hasta_raw | map('replace', '00:00', '24:00') | map('replace', '23:59', '24:00') | list }}"
          total: "{% set ns = namespace(n=0) %}{% for i in range(3) %}{% if desde[i] != hasta_raw[i] %}{% set ns.n = i + 1 %}{% endif %}{% endfor %}{{ ns.n }}"
          valido: "{% set ns = namespace(ok=(total | int > 0 or programa == 'Reducción de ruido')) %}{% for i in range(total | int) %}{% if desde[i] == hasta_raw[i] or desde[i] >= hasta[i] %}{% set ns.ok = false %}{% endif %}{% if i > 0 and desde[i] < hasta[i - 1] %}{% set ns.ok = false %}{% endif %}{% endfor %}{{ ns.ok }}"
      - if:
          - condition: template
            value_template: "{{ valido }}"
        then:
          - repeat:
              count: "{{ [total | int, 1] | max }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: ebusd/basv0/{{ set_pref }}{{ dia_en }}/set
                    payload: "{{ '0;0;00:00;00:00' if total | int == 0 else (repeat.index - 1) ~ ';' ~ total ~ ';' ~ desde[repeat.index - 1] ~ ';' ~ hasta[repeat.index - 1] }}"
                    qos: 1
                    retain: false
                - delay:
                    milliseconds: 1500
          - delay:
              seconds: 2
          - action: mqtt.publish
            data:
              topic: ebusd/basv0/{{ slots_topic }}/get
              payload: "1"
              retain: false
          - repeat:
              count: 3
              sequence:
                - action: mqtt.publish
                  data:
                    topic: ebusd/basv0/{{ get_pref }}{{ dia_en }}{{ repeat.index - 1 }}/get
                    payload: "1"
                    retain: false
                - delay:
                    milliseconds: 700
          - action: persistent_notification.create
            data:
              title: Horario {{ programa }} enviado
              message: "{{ programa }} - {{ states('input_select.acs_horario_dia') }}: {{ total }} franja(s) -> {% for i in range(total | int) %}{{ desde[i] }}-{{ hasta[i] }}{% if not loop.last %}, {% endif %}{% endfor %}. Comprueba el resultado en las listas de la vista Aerotermia Horarios."
              notification_id: acs_horario
        else:
          - action: persistent_notification.create
            data:
              title: Horario {{ programa }} NO enviado
              message: "Franjas no válidas: cada 'desde' debe ser anterior a su 'hasta', no pueden solaparse ni dejar huecos (franja 2 vacía con la 3 rellena), y debe haber al menos una. Desde={{ desde }} Hasta={{ hasta_raw }}"
              notification_id: acs_horario
          - stop: Franjas no válidas
            error: true
  acs_cargar_horario_dia:
    alias: ACS/Refrigeración/Ruido - Cargar horario actual del día en el formulario
    icon: mdi:download
    description: Copia a los helpers 'ACS horario ...' las franjas que tiene ahora el termostato para el día y programa elegidos (solo lectura; no escribe en el bus). Una franja inexistente se carga como 00:00-00:00 (vacía); 24:00 se carga como 23:59.
    mode: single
    sequence:
      - variables:
          dias_en:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          slugs:
            - lunes
            - martes
            - miercoles
            - jueves
            - viernes
            - sabado
            - domingo
          programa: "{{ states('input_select.acs_horario_programa') }}"
          get_pref: "{{ {'ACS': 'HwcTimer_', 'Refrigeración': 'Z1TimerCool_', 'Reducción de ruido': 'SilentTimer_'}[programa] }}"
          sens_pref: "{{ {'ACS': 'acs_horario_', 'Refrigeración': 'refrigeracion_horario_', 'Reducción de ruido': 'ruido_horario_'}[programa] }}"
          dia_idx: "{{ state_attr('input_select.acs_horario_dia', 'options').index(states('input_select.acs_horario_dia')) }}"
          dia_en: "{{ dias_en[dia_idx | int] }}"
          slug: "{{ slugs[dia_idx | int] }}"
          desde_ids:
            - input_datetime.acs_horario_desde
            - input_datetime.acs_horario_franja_2_desde
            - input_datetime.acs_horario_franja_3_desde
          hasta_ids:
            - input_datetime.acs_horario_hasta
            - input_datetime.acs_horario_franja_2_hasta
            - input_datetime.acs_horario_franja_3_hasta
      - repeat:
          count: 3
          sequence:
            - action: mqtt.publish
              data:
                topic: ebusd/basv0/{{ get_pref }}{{ dia_en }}{{ repeat.index - 1 }}/get
                payload: "1"
                retain: false
            - delay:
                milliseconds: 700
      - delay:
          seconds: 1
      - repeat:
          count: 3
          sequence:
            - variables:
                valor: "{{ states('sensor.' ~ sens_pref ~ slug ~ '_' ~ repeat.index) }}"
                hay: "{{ '-' in valor }}"
                d: "{{ (valor.split('-')[0] if hay else '00:00') ~ ':00' }}"
                h: "{{ ((valor.split('-')[1] if hay else '00:00') | replace('24:00', '23:59')) ~ ':00' }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ desde_ids[repeat.index - 1] }}"
              data:
                time: "{{ d }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ hasta_ids[repeat.index - 1] }}"
              data:
                time: "{{ h }}"
  acs_seleccionar_y_cargar:
    alias: ACS/Refrigeración/Ruido - Seleccionar día y cargar su horario
    icon: mdi:cursor-default-click
    description: Pone programa y día en el formulario y carga el horario actual del termostato (solo lectura; no escribe en el bus). Lo usan las filas de las listas de la vista Aerotermia Horarios.
    mode: single
    fields:
      dia:
        name: Día
        description: Lunes ... Domingo
        required: true
        selector:
          select:
            options:
              - Lunes
              - Martes
              - Miércoles
              - Jueves
              - Viernes
              - Sábado
              - Domingo
      programa:
        name: Programa
        description: ACS, Refrigeración o Reducción de ruido
        required: true
        selector:
          select:
            options:
              - ACS
              - Refrigeración
              - Reducción de ruido
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.acs_horario_programa
        data:
          option: "{{ programa }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.acs_horario_dia
        data:
          option: "{{ dia }}"
      - action: script.acs_cargar_horario_dia
  acs_leer_todos_horarios:
    alias: ACS/Refrigeración/Ruido - Leer todos los horarios del termostato
    icon: mdi:refresh
    description: "Solo lectura (no escribe en el bus): pide a ebusd que relea del termostato el número de franjas y las 3 franjas de los 7 días del programa indicado, o de los tres si es 'Todos', para refrescar las tablas de la vista Aerotermia Horarios."
    mode: single
    fields:
      programa:
        name: Programa
        description: ACS, Refrigeración, Reducción de ruido o Todos
        required: false
        default: Todos
        selector:
          select:
            options:
              - Todos
              - ACS
              - Refrigeración
              - Reducción de ruido
    sequence:
      - variables:
          prog: "{{ programa | default('Todos') }}"
          dias:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          topics: "{% set m = {'ACS': ['HwcTimer_', 'HwcTimerSlots'], 'Refrigeración': ['Z1TimerCool_', 'Z1TimerCoolSlots'], 'Reducción de ruido': ['SilentTimer_', 'SilentTimerSlots']} %}{% set sel = (m.keys() | list) if prog == 'Todos' else [prog] %}{% set ns = namespace(l=[]) %}{% for k in sel %}{% set ns.l = ns.l + [m[k][1]] %}{% for d in dias %}{% for i in range(3) %}{% set ns.l = ns.l + [m[k][0] ~ d ~ i] %}{% endfor %}{% endfor %}{% endfor %}{{ ns.l }}"
      - repeat:
          for_each: "{{ topics }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: ebusd/basv0/{{ repeat.item }}/get
                payload: "1"
                retain: false
            - delay:
                milliseconds: 250
  calefaccion_aplicar_horario:
    alias: Calefacción Z1 - Aplicar horario del día al termostato
    icon: mdi:radiator
    description: Escribe en el termostato (b555, circuito basv0) el programa horario de calefacción Z1 del día elegido a partir del texto 'Calefaccion horario texto' (formato HH:MM-HH:MM@T separado por comas, p. ej. 03:10-09:30@19.0, 09:30-24:00@21.0). Valida el formato, desde<hasta, que no se solapen, de 1 a 12 franjas y temperaturas de 5 a 30 en pasos de 0,5. El termostato exige el día completo en orden desde la franja 1. Escribe de verdad en el bus eBUS.
    mode: single
    sequence:
      - variables:
          dias_en:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          dia_idx: "{{ state_attr('input_select.calefaccion_horario_dia', 'options').index(states('input_select.calefaccion_horario_dia')) }}"
          dia_en: "{{ dias_en[dia_idx | int] }}"
          texto: "{{ states('input_text.calefaccion_horario_texto') }}"
          plan: "{% set ns = namespace(ok=true, d=[], h=[], t=[]) %}{% for p in texto.split(',') if p.strip() != '' %}{% set q = p.strip().split('@') %}{% set r = q[0].split('-') %}{% if q | length == 2 and r | length == 2 %}{% set a = r[0].strip() %}{% set b = r[1].strip() %}{% set c = q[1].strip() %}{% if (a | regex_match('^([01][0-9]|2[0-3]):[0-5][0-9]$')) and ((b | regex_match('^([01][0-9]|2[0-3]):[0-5][0-9]$')) or b == '24:00') and (c | regex_match('^[0-9]+([.][0-9])?$')) %}{% set ns.d = ns.d + [a] %}{% set ns.h = ns.h + [b] %}{% set ns.t = ns.t + [c | float] %}{% else %}{% set ns.ok = false %}{% endif %}{% else %}{% set ns.ok = false %}{% endif %}{% endfor %}{% set n = ns.d | length %}{% if n == 0 or n > 12 %}{% set ns.ok = false %}{% endif %}{% for i in range(n) %}{% if ns.d[i] >= ns.h[i] %}{% set ns.ok = false %}{% endif %}{% if i > 0 and ns.d[i] < ns.h[i - 1] %}{% set ns.ok = false %}{% endif %}{% if ns.t[i] < 5 or ns.t[i] > 30 or (ns.t[i] * 2) % 1 != 0 %}{% set ns.ok = false %}{% endif %}{% endfor %}{{ {'ok': ns.ok, 'd': ns.d, 'h': ns.h, 't': ns.t, 'n': n} }}"
      - if:
          - condition: template
            value_template: "{{ plan.ok }}"
        then:
          - repeat:
              count: "{{ plan.n }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: ebusd/basv0/Z1TimerHeatSet_{{ dia_en }}/set
                    payload: "{{ repeat.index - 1 }};{{ plan.n }};{{ plan.d[repeat.index - 1] }};{{ plan.h[repeat.index - 1] }};{{ '%.1f' | format(plan.t[repeat.index - 1]) }}"
                    qos: 1
                    retain: false
                - delay:
                    milliseconds: 1500
          - delay:
              seconds: 2
          - action: mqtt.publish
            data:
              topic: ebusd/basv0/Z1TimerHeatSlots/get
              payload: "1"
              retain: false
          - repeat:
              count: 12
              sequence:
                - action: mqtt.publish
                  data:
                    topic: ebusd/basv0/Z1TimerHeat_{{ dia_en }}{{ repeat.index - 1 }}/get
                    payload: "1"
                    retain: false
                - delay:
                    milliseconds: 700
          - action: persistent_notification.create
            data:
              title: Horario de calefacción enviado
              message: "{{ states('input_select.calefaccion_horario_dia') }}: {{ plan.n }} franja(s). Comprueba el resultado en la lista de la vista Aerotermia Horarios."
              notification_id: calefaccion_horario
        else:
          - action: persistent_notification.create
            data:
              title: Horario de calefacción NO enviado
              message: "Texto no válido. Formato: HH:MM-HH:MM@T separado por comas (p. ej. 03:10-09:30@19.0, 09:30-24:00@21.0); de 1 a 12 franjas, desde anterior a hasta, sin solapes, temperaturas de 5 a 30 en pasos de 0,5. Texto recibido: {{ texto }}"
              notification_id: calefaccion_horario
          - stop: Texto no válido
            error: true
  calefaccion_cargar_horario_dia:
    alias: Calefacción Z1 - Cargar horario actual del día en el campo de texto
    icon: mdi:download
    description: Lee del termostato (solo lectura, no escribe en el bus) las franjas de calefacción Z1 del día elegido en 'Calefaccion horario dia' y las deja en 'Calefaccion horario texto' con el formato HH:MM-HH:MM@T, separadas por comas.
    mode: single
    sequence:
      - variables:
          dias_en:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          slugs:
            - lunes
            - martes
            - miercoles
            - jueves
            - viernes
            - sabado
            - domingo
          dia_idx: "{{ state_attr('input_select.calefaccion_horario_dia', 'options').index(states('input_select.calefaccion_horario_dia')) }}"
          dia_en: "{{ dias_en[dia_idx | int] }}"
          slug: "{{ slugs[dia_idx | int] }}"
      - repeat:
          count: 12
          sequence:
            - action: mqtt.publish
              data:
                topic: ebusd/basv0/Z1TimerHeat_{{ dia_en }}{{ repeat.index - 1 }}/get
                payload: "1"
                retain: false
            - delay:
                milliseconds: 500
      - delay:
          seconds: 1
      - variables:
          texto: "{% set ns = namespace(l=[]) %}{% for i in range(1, 13) %}{% set v = states('sensor.calefaccion_horario_' ~ slug ~ '_' ~ i) %}{% if v not in ['sin franja', 'unknown', 'unavailable'] %}{% set ns.l = ns.l + [v] %}{% endif %}{% endfor %}{{ ns.l | join(', ') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.calefaccion_horario_texto
        data:
          value: "{{ texto }}"
  calefaccion_seleccionar_y_cargar:
    alias: Calefacción Z1 - Seleccionar día y cargar su horario
    icon: mdi:cursor-default-click
    description: Pone el día en el formulario de calefacción y carga su horario actual (solo lectura). Lo usan las filas de la tabla de calefacción de la vista Aerotermia Horarios.
    mode: single
    fields:
      dia:
        name: Día
        description: Lunes ... Domingo
        required: true
        selector:
          select:
            options:
              - Lunes
              - Martes
              - Miércoles
              - Jueves
              - Viernes
              - Sábado
              - Domingo
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.calefaccion_horario_dia
        data:
          option: "{{ dia }}"
      - action: script.calefaccion_cargar_horario_dia
  calefaccion_leer_todos_horarios:
    alias: Calefacción Z1 - Leer todos los horarios del termostato
    icon: mdi:refresh
    description: "Solo lectura (no escribe en el bus): pide a ebusd que relea del termostato el número de franjas y las 12 franjas posibles de los 7 días del programa de calefacción Z1, para refrescar la lista de la vista Aerotermia Horarios."
    mode: single
    sequence:
      - variables:
          dias:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          topics: "{% set ns = namespace(l=['Z1TimerHeatSlots']) %}{% for d in dias %}{% for i in range(12) %}{% set ns.l = ns.l + ['Z1TimerHeat_' ~ d ~ i] %}{% endfor %}{% endfor %}{{ ns.l }}"
      - repeat:
          for_each: "{{ topics }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: ebusd/basv0/{{ repeat.item }}/get
                payload: "1"
                retain: false
            - delay:
                milliseconds: 250
