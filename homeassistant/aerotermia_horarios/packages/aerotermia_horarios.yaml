        state: "{% set ns = namespace(n=0, t=[]) %}{% for i in range(1, 13) %}{% set v = states('sensor.calefaccion_horario_viernes_' ~ i) %}{% if v not in ['sin franja', 'unknown', 'unavailable'] and '@' in v %}{% set ns.n = ns.n + 1 %}{% set ns.t = ns.t + [v.split('@')[1] | float(0)] %}{% endif %}{% endfor %}{{ (ns.n ~ (' franja' if ns.n == 1 else ' franjas') ~ ' · ' ~ ns.t | min ~ '–' ~ ns.t | max ~ ' °C') if ns.n else '—' }}"
      - name: Calefaccion resumen Sabado
